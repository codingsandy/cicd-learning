name: Day 6 Cache & Artifacts
on:
  push:
    branches: [ "main" ]
jobs:
      build-test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4
            
          - name: Set up node.js
            uses: actions/setup-node@v4
            with:
              node-version: '18'
              cache: 'npm'

          - name: install dependencies
            run: npm install

          - name: Run tests
            run: npm test
name: Day 8 Environments & Approval
on:
  push:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
         node-version: '18'
         cache: 'npm'

      - run: npm install
      - run: npm test
  deploy-prod:
        needs: ci
        runs-on: ubuntu-latest
        environment:
          name: production
          
        steps:
          - name: Deploy to production
            run: |
             echo "🚀 Deploying to PRODUCTION"
             echo "App deployed!"